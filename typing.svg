<svg xmlns="http://www.w3.org/2000/svg"
     width="760" height="45"
     viewBox="0 0 760 45">

  <style>
    .text {
      font-family: "Courier New", monospace;
      font-size: 18px;
      font-weight: bold;
      fill: #A78BFA;
    }

    .reveal {
      animation: typing 18s infinite;
    }

    .cursor {
      fill: #C4B5FD;
      animation:
        cursorMove 18s infinite,
        blink 0.8s step-end infinite;
    }

    @keyframes typing {
      0% {
        width: 0px;
        animation-timing-function: steps(16, end);
      }

      22% {
        width: 172.8px;
      }

      30% {
        width: 172.8px;
        animation-timing-function: steps(19, end);
      }

      52% {
        width: 378px;
      }

      60% {
        width: 378px;
        animation-timing-function: steps(20, end);
      }

      78% {
        width: 594px;
      }

      87% {
        width: 594px;
        animation-timing-function: steps(55, end);
      }

      97% {
        width: 0px;
      }

      100% {
        width: 0px;
      }
    }

    @keyframes cursorMove {
      0% {
        transform: translateX(0px);
        animation-timing-function: steps(16, end);
      }

      22% {
        transform: translateX(172.8px);
      }

      30% {
        transform: translateX(172.8px);
        animation-timing-function: steps(19, end);
      }

      52% {
        transform: translateX(378px);
      }

      60% {
        transform: translateX(378px);
        animation-timing-function: steps(20, end);
      }

      78% {
        transform: translateX(594px);
      }

      87% {
        transform: translateX(594px);
        animation-timing-function: steps(55, end);
      }

      97% {
        transform: translateX(0px);
      }

      100% {
        transform: translateX(0px);
      }
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }

      50%, 100% {
        opacity: 0;
      }
    }
  </style>

  <defs>
    <clipPath id="typing-clip">
      <rect class="reveal"
            x="0"
            y="0"
            width="0"
            height="45"/>
    </clipPath>
  </defs>

  <g clip-path="url(#typing-clip)">
    <text class="text"
          x="0"
          y="30"
          textLength="594"
          lengthAdjust="spacingAndGlyphs">Graphic Designer × Junior Developer × Building ANKA FIT</text>
  </g>

  <rect class="cursor"
        x="0"
        y="12"
        width="2"
        height="22"
        rx="1"/>

</svg>
